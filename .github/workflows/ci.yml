name: App checks and builds
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Build H5 and WeChat mini program
        env:
          VITE_API_ORIGIN: http://127.0.0.1:8897
          VITE_USE_WECHAT_LOGIN: "false"
        run: |
          pnpm run build:h5
          pnpm run build:mp-weixin
      - uses: actions/upload-artifact@v4
        with:
          name: xin-binlang-app-${{ github.sha }}
          path: dist/build
          retention-days: 14
